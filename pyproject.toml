[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-perspective-correction"
version = "0.1.0"
description = "Robust batch perspective correction for architectural photography"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sven Hinrichs" }]
keywords = ["photography", "architecture", "perspective", "rectification", "vanishing-point"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "Pillow>=10.0", "piexif>=1.1.3"]

[project.scripts]
bpc = "bpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
